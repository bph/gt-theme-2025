name: Deploy theme to Pressable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: deploy-pressable
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Sync theme files via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: sftp.pressable.com
          protocol: sftp
          port: 22
          username: ${{ secrets.PRESSABLE_SFTP_USER }}
          password: ${{ secrets.PRESSABLE_SFTP_PASSWORD }}
          server-dir: /srv/htdocs/wp-content/themes/gt-theme-2025/
          local-dir: ./
          exclude: |
            **/.git/**
            **/.github/**
            **/node_modules/**
            **/*.zip
            **/.DS_Store
            readme.md
