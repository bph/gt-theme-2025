name: Deploy theme to Pressable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: deploy-pressable
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy theme via SFTP
        env:
          SFTP_USER: ${{ secrets.PRESSABLE_SFTP_USER }}
          SFTP_PASS: ${{ secrets.PRESSABLE_SFTP_PASSWORD }}
        run: |
          lftp -u "$SFTP_USER,$SFTP_PASS" sftp://sftp.pressable.com <<'EOF'
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 20
          mirror --reverse --delete --verbose \
            --exclude-glob '.git/' \
            --exclude-glob '.github/' \
            --exclude-glob 'node_modules/' \
            --exclude-glob '*.zip' \
            --exclude-glob '.DS_Store' \
            --exclude-glob 'readme.md' \
            ./ /srv/htdocs/wp-content/themes/gt-theme-2025/
          bye
          EOF
